# Configuration de la CLI Supabase pour le DÉVELOPPEMENT LOCAL (supabase start / db start).
# Elle ne configure pas les projets hébergés : voir docs/DEPLOIEMENT.md.
project_id = "amanah-finance"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false
double_confirm_changes = true
otp_expiry = 3600

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true
