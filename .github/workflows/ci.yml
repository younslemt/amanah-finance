# Intégration continue : installation, contrôles, tests, compilation Next.js, e2e, démarrage.
# Aucun déploiement. Aucun secret requis : l'application est construite en mode démo.
name: CI

on:
  pull_request:
  push:
    branches: [main, 'sprint-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_APP_MODE: demo
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  app:
    name: Application (install, typecheck, lint, tests, build, e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4   # version lue dans package.json (packageManager)

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Cache du store pnpm
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml', '**/package.json') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Installation des dépendances
        id: install
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
            echo "lockfile=existing" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::pnpm-lock.yaml absent : installation sans verrou. Committer le fichier fourni en artefact."
            pnpm install --no-frozen-lockfile
            echo "lockfile=generated" >> "$GITHUB_OUTPUT"
          fi

      - name: Publier le pnpm-lock.yaml généré
        if: steps.install.outputs.lockfile == 'generated'
        uses: actions/upload-artifact@v4
        with:
          name: pnpm-lock
          path: pnpm-lock.yaml

      - name: Afficher le pnpm-lock.yaml généré (pour le versionner)
        if: steps.install.outputs.lockfile == 'generated'
        run: |
          echo "=====DEBUT-PNPM-LOCK====="
          base64 -w0 pnpm-lock.yaml; echo
          echo "=====FIN-PNPM-LOCK====="

      - name: Règles de dépendance entre couches
        run: pnpm check:boundaries

      - name: TypeScript (tous les paquets, fichiers TSX compris)
        run: pnpm -r typecheck

      - name: ESLint
        run: pnpm lint

      - name: Tests Vitest
        run: pnpm -r test:ci

      - name: Compilation Next.js
        run: pnpm --filter @amanah/web build 2>&1 | tee build.log

      - name: Démarrage de l'application
        run: |
          pnpm --filter @amanah/web start > start.log 2>&1 &
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/dashboard || true)
            [ "$code" = "200" ] && break; sleep 2
          done
          echo "HTTP /dashboard : $code"
          if [ "$code" != "200" ]; then echo "----- start.log -----"; cat start.log; exit 1; fi
          curl -sI http://localhost:3000/dashboard | grep -i "content-security-policy"
          curl -s http://localhost:3000/dashboard | grep -q "Mode démonstration"
          # Le serveur reste démarré : les tests Playwright l'utilisent (reuseExistingServer).

      - name: Navigateur Playwright
        run: pnpm --filter @amanah/web exec playwright install --with-deps chromium

      - name: Tests Playwright (mobile et ordinateur)
        run: pnpm --filter @amanah/web test:e2e
        env:
          CI: 'true'

      - name: Audit des dépendances de production
        run: pnpm audit --prod --audit-level high

      - name: Rapports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-app
          path: |
            build.log
            start.log
            **/reports/*.xml
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore

  database:
    name: Base de données (PostgreSQL 16, migrations, RLS)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: amanah_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Migrations et tests SQL
        run: ./scripts/test-db.sh 2>&1 | tee sql-tests.log
        env: { DATABASE_URL: postgres://postgres:postgres@localhost:5432/amanah_test }
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: rapports-sql, path: sql-tests.log }

  supabase:
    name: Base de données (image Supabase réelle)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: Démarrer Postgres Supabase et appliquer les migrations
        run: supabase db start
      - name: Tests SQL contre l'image Supabase (sans stub)
        run: ./scripts/test-db.sh 2>&1 | tee supabase-tests.log
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          TEST_DB_TARGET: supabase
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: rapports-supabase, path: supabase-tests.log }
